datasets:
- neurodata_type_def: FiringRate
  neurodata_type_inc: VectorData
  dtype: float
  doc: Mean firing rate of the unit, computed as the number of spikes divided by
    the recording duration. Cell-intrinsic property; written as a column on 
    nwbfile.units.
  attributes:
  - name: unit
    dtype: text
    value: hertz
    doc: Unit of measurement.
- neurodata_type_def: NumSpikes
  neurodata_type_inc: VectorData
  dtype: int64
  doc: Total number of spikes of the unit. Cell-intrinsic property; written as a
    column on nwbfile.units.
- neurodata_type_def: UnitVectorData
  neurodata_type_inc: VectorData
  doc: A VectorData column carrying per-unit values. May reference the 
    TimeIntervals over which the values were computed, via the optional 
    `time_support` attribute. Used as the column type for run-dependent metric 
    values on UnitsMetrics; also suitable for cell-intrinsic typed columns on 
    the Units table.
  attributes:
  - name: time_support
    dtype:
      target_type: TimeIntervals
      reftype: object
    doc: Object reference to the TimeIntervals (plain or a ValidUnitPeriods 
      subclass) over which this column's values were computed. Absent when no 
      time restriction was applied (e.g., for metrics whose computation does not
      respect per-unit periods).
    required: false
groups:
- neurodata_type_def: RandomSpikes
  neurodata_type_inc: NWBDataInterface
  default_name: random_spikes
  doc: Random spike indices per unit for waveform extraction and template 
    computation. Stores indices into each unit's spike train as a ragged array.
  datasets:
  - name: random_spikes_indices
    neurodata_type_inc: VectorData
    dtype: int64
    dims:
    - num_spikes_total
    shape:
    - null
    doc: Concatenated array of spike indices for all units. Each value is an 
      index into the spike train for that unit. Use random_spikes_indices_index 
      to retrieve indices for each unit.
  - name: random_spikes_indices_index
    neurodata_type_inc: VectorIndex
    doc: Index into random_spikes_indices for each unit. The indices for unit i 
      are 
      random_spikes_indices[random_spikes_indices_index[i-1]:random_spikes_indices_index[i]].
- neurodata_type_def: Waveforms
  neurodata_type_inc: NWBDataInterface
  default_name: waveforms
  doc: Individual spike waveforms organized as a double-ragged array. Each row 
    in data is one channel's waveform for one spike. The first VectorIndex 
    (data_index) groups rows by spike, and the second VectorIndex 
    (data_index_index) groups spikes by unit.
  attributes:
  - name: peak_sample_index
    dtype: int32
    doc: 'The index of the peak sample in the template waveform (0-indexed). This
      is the alignment point used during spike sorting, typically the point of maximum
      absolute amplitude. Combined with the number of samples from the data shape,
      this fully specifies the temporal structure: samples_before = peak_sample_index,
      samples_after = n_samples - peak_sample_index.'
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float32
    dims:
    - num_channel_waveforms_total
    - num_samples
    shape:
    - null
    - null
    doc: Flattened waveform data. Each row is one channel's waveform for one 
      spike. Shape is (total_channel_waveforms, num_samples).
    attributes:
    - name: unit
      dtype: text
      default_value: microvolts
      doc: Unit of measurement for waveform data.
      required: false
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data per spike. Groups channel-waveforms by spike. The 
      waveforms for spike j are data[data_index[j-1]:data_index[j], :].
  - name: data_index_index
    neurodata_type_inc: VectorIndex
    doc: Index into data_index per unit. Groups spikes by unit. The spike 
      indices for unit i are 
      data_index[data_index_index[i-1]:data_index_index[i]].
  - name: electrodes
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the electrodes table for each row in data. Has the same 
      length as the first dimension of data, identifying the channel for each 
      waveform row.
  links:
  - name: random_spikes
    target_type: RandomSpikes
    doc: Link to the RandomSpikes used to extract waveforms.
- neurodata_type_def: Templates
  neurodata_type_inc: NWBDataInterface
  default_name: templates
  doc: Template waveforms per unit stored as a ragged array. Each row is one 
    channel's waveform for one unit. When sparsity is used, only active channels
    are stored per unit. Without sparsity, all channels are stored for each 
    unit.
  attributes:
  - name: peak_sample_index
    dtype: int32
    doc: 'The index of the peak sample in the template waveform (0-indexed). This
      is the alignment point used during spike sorting, typically the point of maximum
      absolute amplitude. Combined with the number of samples from the data shape,
      this fully specifies the temporal structure: samples_before = peak_sample_index,
      samples_after = n_samples - peak_sample_index.'
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float32
    dims:
    - num_waveforms
    - num_samples
    shape:
    - null
    - null
    doc: Template waveforms as a ragged array. Shape is (total_waveforms, 
      num_samples) where total_waveforms is the sum of channels per unit across 
      all units. Use data_index to retrieve waveforms for each unit, and 
      electrodes to identify which electrode each row corresponds to.
    attributes:
    - name: unit
      dtype: text
      default_value: microvolts
      doc: Unit of measurement for template data.
      required: false
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data for each unit. The templates for unit i are 
      data[data_index[i-1]:data_index[i], :].
  - name: electrodes
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the electrodes table for each row in data. Has the same 
      length as the first dimension of data, so data_index indexes both datasets
      in lockstep. The electrodes for unit i are 
      electrodes[data_index[i-1]:data_index[i]].
- neurodata_type_def: NoiseLevels
  neurodata_type_inc: NWBDataInterface
  default_name: noise_levels
  doc: Noise levels estimated after preprocessing for each channel
  datasets:
  - name: data
    dtype: float32
    dims:
    - num_channels
    shape:
    - null
    doc: Array of noise levels for each channel. Order and length must match 
      SpikeSortingContainer.electrodes.
    attributes:
    - name: unit
      dtype: text
      default_value: microvolts
      doc: Unit of measurement for noise data.
      required: false
- neurodata_type_def: UnitLocations
  neurodata_type_inc: NWBDataInterface
  default_name: unit_locations
  doc: Estimated locations for each unit in x-y and optionally z dimensions.
  datasets:
  - name: data
    dtype: float
    dims:
    - - num_units
      - x, y
    - - num_units
      - x, y, z
    shape:
    - - null
      - 2
    - - null
      - 3
    doc: Locations of units. Shape is (num_units, 2) for 2D locations (x-y) or 
      (num_units, 3) for 3D locations (x-y-z).
    attributes:
    - name: unit
      dtype: text
      default_value: micrometers
      doc: Unit of measurement for unit locations data.
      required: false
- neurodata_type_def: Correlograms
  neurodata_type_inc: NWBDataInterface
  default_name: correlograms
  doc: Cross-correlogram spike counts for each unit pair. Diagonal entries are 
    auto-correlograms. Each value is the number of spike coincidences within the
    corresponding time lag bin.
  datasets:
  - name: data
    dtype: int
    dims:
    - num_units
    - num_units
    - num_bins
    shape:
    - null
    - null
    - null
    doc: Correlograms for each pair of unit.
  - name: bin_edges
    dtype: float
    dims:
    - num_bin_edges
    shape:
    - null
    doc: bin edges in ms over which counts are computed.
- neurodata_type_def: ISIHistograms
  neurodata_type_inc: NWBDataInterface
  default_name: isi_histograms
  doc: Inter-spike-interval histogram counts for each unit. Each value is the 
    number of consecutive spike pairs whose interval falls within the 
    corresponding bin.
  datasets:
  - name: data
    dtype: int
    dims:
    - num_units
    - num_bins
    shape:
    - null
    - null
    doc: ISI histograms for each unit.
  - name: bin_edges
    dtype: float
    dims:
    - num_bin_edges
    shape:
    - null
    doc: bin edges in ms over which counts are computed.
- neurodata_type_def: TemplateSimilarity
  neurodata_type_inc: NWBDataInterface
  default_name: template_similarity
  doc: The template similarity for each unit pair.
  datasets:
  - name: data
    dtype: float
    dims:
    - num_units
    - num_units
    shape:
    - null
    - null
    doc: The similarity value for each unit pair.
- neurodata_type_def: SpikeAmplitudes
  neurodata_type_inc: NWBDataInterface
  default_name: spike_amplitudes
  doc: The amplitude of each spike in uV.
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_spikes_total
    shape:
    - null
    doc: Concatenated array of spike amplitudes for all units. Use 
      spike_amplitude_index to retrieve indices for each unit.
    attributes:
    - name: unit
      dtype: text
      default_value: microvolts
      doc: Unit of measurement for spike amplitudes data.
      required: false
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data for each unit. The indices for unit i are 
      data[data_index[i-1]:data_index[i]].
- neurodata_type_def: SpikeLocations
  neurodata_type_inc: NWBDataInterface
  default_name: spike_locations
  doc: The estimated location of each spike in 2D or 3D.
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - - num_spikes_total
      - x, y
    - - num_spikes_total
      - x, y, z
    shape:
    - - null
      - 2
    - - null
      - 3
    doc: Concatenated array of spike locations for all units. Use 
      spike_location_index to retrieve indices for each unit.
    attributes:
    - name: unit
      dtype: text
      default_value: micrometers
      doc: Unit of measurement for spike locations data.
      required: false
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data for each unit. The indices for unit i are 
      data[data_index[i-1]:data_index[i]].
- neurodata_type_def: AmplitudeScalings
  neurodata_type_inc: NWBDataInterface
  default_name: amplitude_scalings
  doc: The amplitude scaling of each spike (the relative amplitude of the spike 
    with respect to the template)
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float32
    dims:
    - num_spikes_total
    shape:
    - null
    doc: Concatenated array of amplitude scalings for all units. Use 
      amplitude_scalings_index to retrieve indices for each unit.
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data for each unit. The indices for unit i are 
      data[data_index[i-1]:data_index[i]].
- neurodata_type_def: PCAProjectionsByChannel
  neurodata_type_inc: NWBDataInterface
  default_name: pca_projections_by_channel
  doc: PCA projections of spikes organized as a double-ragged array for 
    per-channel PCA (by_channel_local mode). Each row in data is one channel's 
    PCA projection for one spike. The first VectorIndex (data_index) groups rows
    by spike, and the second VectorIndex (data_index_index) groups spikes by 
    unit.
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_channel_projections_total
    - num_components
    shape:
    - null
    - null
    doc: Flattened PCA projection data. Each row is one channel's projection for
      one spike. Shape is (total_channel_projections, num_components).
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data per spike. Groups channel-projections by spike. The 
      projections for spike j are data[data_index[j-1]:data_index[j], :].
  - name: data_index_index
    neurodata_type_inc: VectorIndex
    doc: Index into data_index per unit. Groups spikes by unit. The spike 
      indices for unit i are 
      data_index[data_index_index[i-1]:data_index_index[i]].
  - name: electrodes
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the electrodes table for each row in data. Has the same 
      length as the first dimension of data, identifying the channel for each 
      projection row.
  links:
  - name: waveforms
    target_type: Waveforms
    doc: Link to the Waveforms from which these projections were computed.
- neurodata_type_def: PCAProjectionsConcatenated
  neurodata_type_inc: NWBDataInterface
  default_name: pca_projections_concatenated
  doc: PCA projections of spikes where channels are flattened into a single 
    feature vector before PCA (concatenated mode). Each row in data is the 
    concatenated projection for one spike. The VectorIndex (data_index) groups 
    spikes by unit.
  datasets:
  - name: data
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_spikes_total
    - num_components
    shape:
    - null
    - null
    doc: PCA projection data. Each row is the concatenated projection across all
      channels for one spike. Shape is (total_spikes, num_components).
  - name: data_index
    neurodata_type_inc: VectorIndex
    doc: Index into data per unit. The projections for unit i are 
      data[data_index[i-1]:data_index[i], :].
  links:
  - name: waveforms
    target_type: Waveforms
    doc: Link to the Waveforms from which these projections were computed.
- neurodata_type_def: ValidUnitPeriods
  neurodata_type_inc: TimeIntervals
  default_name: valid_unit_periods
  doc: Valid time periods for each unit, typically computed from false 
    positive/negative rate estimation or user-defined. Each row represents one 
    valid period for one unit, with start and stop times inherited from 
    TimeIntervals. If a unit has multiple disjoint valid periods, each period is
    stored as a separate row referencing the same unit.
  datasets:
  - name: unit
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the units table for each row, identifying which unit each 
      valid period belongs to.
- neurodata_type_def: UnitsMetrics
  neurodata_type_inc: DynamicTable
  default_name: units_metrics
  doc: Per-unit metric values from one analysis run. Each row is one unit; 
    columns are metric values, typed as UnitVectorData so they can carry an 
    optional reference to the TimeIntervals over which they were computed. The 
    required `unit` DynamicTableRegion references the corresponding row in 
    nwbfile.units. Multiple instances coexist under SpikeSortingExtensions for 
    different analysis runs.
  datasets:
  - name: unit
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the row in nwbfile.units that each row of this 
      UnitsMetrics describes.
- neurodata_type_def: GlobalSpikeTrain
  neurodata_type_inc: NWBDataInterface
  default_name: global_spike_train
  doc: 'A single time-sorted spike train that merges the spikes of all units into
    one sequence ordered by spike time. It is the time-major counterpart to nwbfile.units.spike_times,
    which instead groups spikes by unit: the same spike events, re-sorted by time,
    with a per-spike unit_index recording which unit each spike came from. The spike_times,
    unit_index, and optional sample_index datasets are parallel and read in lockstep,
    so element k of each describes the same spike. All three have the same length
    num_spikes_total, so a reader can size buffers from any one of them. Because the
    train is sorted by time, all spikes in a time interval form one contiguous run
    retrievable by binary search on spike_times, which makes population time-window
    queries efficient even over remote/streaming files; the per-unit units table cannot
    answer those cheaply. This type is optional and fully derived from nwbfile.units.spike_times:
    store it when the time-window or streaming access pattern matters, and keep the
    units table for per-unit access.'
  datasets:
  - name: spike_times
    dtype: float64
    dims:
    - num_spikes_total
    shape:
    - null
    doc: Time of each spike in seconds from session start, sorted ascending. 
      Spikes with equal times are ordered by unit_index ascending, so the merge 
      is fully deterministic and stable across writers. Same time coordinate as 
      nwbfile.units.spike_times. Consumers may rely on the ascending order for 
      binary-search time-window queries.
    attributes:
    - name: unit
      dtype: text
      value: seconds
      doc: Unit of measurement.
  - name: unit_index
    dtype: int32
    dims:
    - num_spikes_total
    shape:
    - null
    doc: For each spike, the positional index of the unit that fired, into 
      SpikeSortingContainer.units_region. Parallel to spike_times and indexed in
      lockstep. To recover the unit for spike k, index units_region with 
      unit_index[k]; that resolves to the corresponding row (and id) in 
      nwbfile.units.
  - name: sample_index
    dtype: int64
    dims:
    - num_spikes_total
    shape:
    - null
    doc: Optional sample index of each spike within the source recording, 
      parallel to spike_times. Only meaningful when 
      SpikeSortingContainer.source_electrical_series is linked, since a sample 
      index requires that recording's start time and sampling clock to be 
      defined. When present, sample_index[k] is the exact frame of 
      spike_times[k] in that recording's clock, round((spike_times[k] - 
      recording_start_time) * sampling_rate); it is redundant with spike_times 
      but exact for indexing back into the recording traces.
    quantity: '?'
- neurodata_type_def: SpikeSortingExtensions
  neurodata_type_inc: NWBDataInterface
  default_name: extensions
  doc: Container for spike sorting computed extensions such as templates, random
    spikes, quality metrics, and other derived data.
  groups:
  - neurodata_type_inc: RandomSpikes
    doc: Random spikes extension data.
    quantity: '?'
  - neurodata_type_inc: Waveforms
    doc: Individual spike waveforms (double-ragged).
    quantity: '?'
  - neurodata_type_inc: Templates
    doc: Templates extension data.
    quantity: '?'
  - neurodata_type_inc: NoiseLevels
    doc: Noise levels extension data.
    quantity: '?'
  - neurodata_type_inc: UnitLocations
    doc: Unit locations extension data.
    quantity: '?'
  - neurodata_type_inc: Correlograms
    doc: Unit correlograms.
    quantity: '?'
  - neurodata_type_inc: ISIHistograms
    doc: Unit ISI histograms data.
    quantity: '?'
  - neurodata_type_inc: TemplateSimilarity
    doc: Unit template similarities.
    quantity: '?'
  - neurodata_type_inc: SpikeAmplitudes
    doc: Spike amplitudes extension data.
    quantity: '?'
  - neurodata_type_inc: SpikeLocations
    doc: Spike locations extension data.
    quantity: '?'
  - neurodata_type_inc: AmplitudeScalings
    doc: Amplitudes scalings extension data.
    quantity: '?'
  - neurodata_type_inc: PCAProjectionsByChannel
    doc: Per-channel PCA projections of spikes (double-ragged).
    quantity: '?'
  - neurodata_type_inc: PCAProjectionsConcatenated
    doc: Concatenated-channels PCA projections of spikes (single-ragged).
    quantity: '?'
  - neurodata_type_inc: UnitsMetrics
    doc: Per-unit metrics from one analysis run. Multiple instances coexist for 
      different runs (different parameter sets).
    quantity: '*'
  - neurodata_type_inc: ValidUnitPeriods
    doc: Valid time periods per unit from spike sorting quality estimation. 
      Multiple instances may coexist when different analysis parameter sets 
      produce different validity tables.
    quantity: '*'
  - neurodata_type_inc: TimeIntervals
    doc: Plain NWB-core TimeIntervals tables, used for metric time-support 
      windows when those windows did not come from a validity computation (e.g.,
      user-defined periods passed directly to quality_metrics). Each row has 
      start_time, stop_time, and a `unit` DynamicTableRegion column.
    quantity: '*'
- neurodata_type_def: SpikeSortingContainer
  neurodata_type_inc: NWBDataInterface
  default_name: spike_sorting
  doc: Container for spike sorting results. Contains metadata about the sorting 
    analysis, links to electrodes and units tables, and computed extension data.
  attributes:
  - name: sampling_frequency
    dtype: float64
    doc: Sampling frequency of the recording in Hz.
  - name: num_samples
    dtype: int64
    doc: Total number of samples (frames) in the source recording's timeline. 
      Stored so the file is self-describing in recordingless mode, where there 
      is no ElectricalSeries to read the length from; it gives the exact 
      timeline extent for duration-based metrics (firing rate, presence ratio). 
      The recording duration in seconds is num_samples / sampling_frequency; 
      duration is not stored separately to avoid two values that can disagree.
    required: false
  - name: t_start
    dtype: float64
    doc: Start time of the source recording in seconds, i.e. the time coordinate
      of sample 0. Readers may default this to 0 when absent (spike times are 
      seconds from session start and therefore non-negative); store the real 
      origin here when it is known.
    required: false
  - name: is_filtered
    dtype: bool
    doc: Whether the source recording was filtered. Recorded as provenance so 
      recordingless readers do not have to guess it.
    required: false
  datasets:
  - name: sparsity_mask
    dtype: bool
    dims:
    - num_units
    - num_channels
    shape:
    - null
    - null
    doc: Boolean mask indicating which channels are active (sparse) for each 
      unit. Shape is (num_units, num_channels). True indicates the channel is 
      used for that unit.
    quantity: '?'
  - name: electrodes
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the electrodes table rows that correspond to the channels 
      used in this sorting analysis. Order matches the channel dimension in 
      templates and sparsity_mask.
  - name: units_region
    neurodata_type_inc: DynamicTableRegion
    doc: Reference to the units table rows that correspond to the units in this 
      sorting analysis. Order matches the unit dimension in all data arrays.
  groups:
  - neurodata_type_inc: SpikeSortingExtensions
    doc: Container for computed extension data (templates, random spikes, etc.).
    quantity: '?'
  - neurodata_type_inc: GlobalSpikeTrain
    doc: Optional time-major (globally time-sorted) merged spike train across 
      all units, for fast time-window/population queries. Derived from the units
      spike times.
    quantity: '?'
  links:
  - name: source_electrical_series
    target_type: ElectricalSeries
    doc: Link to the ElectricalSeries from which this sorting was derived. 
      Optional - only present for 'with recording' cases.
    quantity: '?'
